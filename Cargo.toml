[package]
name = "lang"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "crates/lang_std_native"]

[dependencies]
clap = { version = "4.5.13", features = ["derive"] }
colored = "2.1.0"
itertools = "0.13.0"
phf = { version = "0.11.2", features = ["macros"] }
quote = "1.0.36"
rand = "0.8.5"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.2", features = ["io-std", "macros", "rt", "sync"] }
toml = "0.8.23"
tower-lsp = "0.20.0"

[profile.dev.build-override]
opt-level = 3

[profile.dev]
debug = 0
strip = "debuginfo"
